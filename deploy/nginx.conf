# Gemini Perso — Nginx (Dedibox). Copier dans /etc/nginx/sites-available/gemini-perso
# puis : ln -s /etc/nginx/sites-available/gemini-perso /etc/nginx/sites-enabled/
# Remplacer gemini.example.fr par votre domaine. Certificats générés par certbot.

upstream gemini_perso_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gemini.example.fr;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 : install.sh/upgrade.sh adaptent la syntaxe ("listen ... ssl http2"
    # pour Nginx < 1.25.1, "http2 on;" pour Nginx >= 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gemini.example.fr;

    ssl_certificate     /etc/letsencrypt/live/gemini.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemini.example.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Imports Google Takeout jusqu'à 250 Mo
    client_max_body_size 250M;

    # Frontend : build Vite statique
    root /opt/gemini-perso/frontend/build;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API FastAPI — streaming SSE : pas de mise en tampon, délais longs
    location /api/ {
        proxy_pass http://gemini_perso_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
