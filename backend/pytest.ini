[pytest]
# Sequential execution by default: the suite shares one backend (:8010) and mutates shared state
# (users, conversations, memories), so parallel xdist workers caused cross-test races.
# `-n 0` disables parallelism (keep it; serial is NOT `-p no:xdist`, which errors while addopts passes -n).
required_plugins = pytest-xdist
addopts = -n 0
